sonar.projectKey=strata_intranet---Front-end
sonar.projectName=Strata Intranet – Front-end
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=src/__tests__,tests

sonar.sourceEncoding=UTF-8

# tsconfig.sonar.json extends tsconfig.json and explicitly includes tests/** for Playwright
sonar.typescript.tsconfigPath=tsconfig.sonar.json

# Unit tests (Vitest) in src/__tests__ + E2E tests (Playwright) in tests/
sonar.test.inclusions=\
  src/__tests__/**/*.test.ts,\
  src/__tests__/**/*.test.tsx,\
  tests/**/*.spec.ts,\
  tests/auth.setup.ts

sonar.exclusions=\
  node_modules/**,\
  .next/**,\
  public/**,\
  **/generated/**,\
  playwright-report/**,\
  test-results/**,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/*.config.js,\
  next-env.d.ts,\
  ecosystem.config.cjs,\
  src/middleware.ts,\
  src/utils/chapaAccess.ts

# Mirrors vitest.config.ts coverage.exclude — keep in sync
sonar.coverage.exclusions=\
  node_modules/**,\
  .next/**,\
  tests/**,\
  src/__tests__/**,\
  public/**,\
  **/*.config.*,\
  next-env.d.ts,\
  src/middleware.ts,\
  src/utils/chapaAccess.ts,\
  src/app/**,\
  src/components/**,\
  src/private/contatosList.ts,\
  src/utils/apiBackend.ts,\
  src/context/UserContext.tsx,\
  src/utils/contracheques/contrachequesUtils.ts,\
  src/utils/getDirectoryStructure/getDirectoryStructure.ts,\
  src/services/contracheque/contracheque.ts,\
  src/services/profile/profileService.ts

sonar.qualitygate.wait=true
sonar.javascript.lcov.reportPaths=coverage/lcov.info
