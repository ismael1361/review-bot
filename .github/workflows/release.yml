name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: command -v zip >/dev/null || (sudo apt-get update && sudo apt-get install -y zip unzip)
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/review-bot" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Garantir zip disponível
        run: command -v zip >/dev/null || (sudo apt-get update && sudo apt-get install -y zip)
      - name: Exportar bundles por arquitetura
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.name }}"
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          mkdir -p release
          for arch in amd64 arm64; do
            for attempt in 1 2 3 4 5 6; do
              if docker pull --platform "linux/${arch}" "${IMAGE}:${TAG}"; then
                break
              fi
              if [ "$attempt" = 6 ]; then
                exit 1
              fi
              sleep 10
            done
            docker save -o "release-image-${arch}.tar" "${IMAGE}:${TAG}"
            node scripts/release/assemble-bundle.mjs \
              --arch "$arch" \
              --image "$IMAGE" \
              --tag "$TAG" \
              --repo "$REPO" \
              --tar "release-image-${arch}.tar" \
              --out release
            rm -f "release-image-${arch}.tar"
          done
          node scripts/release/render-release-body.mjs \
            --repo "$REPO" \
            --tag "$TAG" \
            --image "$IMAGE" \
            --out release/RELEASE_BODY.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release/RELEASE_BODY.md
          files: |
            release/review-bot-amd64.zip
            release/review-bot-arm64.zip
