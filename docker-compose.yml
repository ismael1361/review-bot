services:
  app:
    build: .
    image: review-bot:local
    environment:
      PORT: ${PORT:-7080}
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${PORT:-7080}:${PORT:-7080}"
    volumes:
      - review-bot-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||7080)+'/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  review-bot-data:
    name: review-bot-data
